name: An idea
description: Something office should do, or should stop doing.
labels: [idea]
body:
  - type: markdown
    attributes:
      value: |
        Worth reading `CONTRIBUTING.md` first. Agent Office packages herdr,
        Firstmate, treehouse and the tools around them behind one config; it
        does not rewrite them. A feature a component should have belongs in
        that component's own repo. The tmux office (0.x) gets no new features.
  - type: textarea
    id: idea
    attributes:
      label: What you want, and the moment you wanted it
      description: The situation matters more than the feature. What were you doing?
    validations: { required: true }
