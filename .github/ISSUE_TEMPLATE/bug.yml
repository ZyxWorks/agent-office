name: Something is broken
description: A wrong meter reading, a broken install, a key that does nothing.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please paste the diagnostics even if the problem looks obvious. Say
        whether you run the herdr-first office (the meter plugin today) or the
        legacy tmux office (0.x). Check the output for private paths or names
        before posting.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected instead
    validations: { required: true }
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Output of the commands for the office you run.
      value: |
        $ uname -s ; echo $TERM_PROGRAM

        herdr (the meter plugin):
        $ herdr --version

        legacy tmux office (0.x):
        $ tmux -V
        $ office doctor
        $ tmux list-panes -a -F '#{session_name} #{pane_id} #{@office_kind} #{pane_left},#{pane_top}'
      render: shell
    validations: { required: true }
  - type: input
    id: terminal
    attributes:
      label: Terminal and OS
      placeholder: WezTerm on macOS 15 / GNOME Terminal on Ubuntu 24.04
    validations: { required: true }
