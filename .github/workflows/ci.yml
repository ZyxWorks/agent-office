# Every probe, on a real tmux server, on both platforms this ships for.
#
# docs/legacy-tmux/CONTRIBUTING.md says there is no test suite, because almost everything here is
# a side effect on a live tmux server. That is still true — and it is exactly
# what these six do: each builds a throwaway office on its own socket, two of
# them attach a REAL client on a pty and type raw bytes at it, and they tear it
# all down again. None needs a display, so they run headless unchanged.
#
# TWO PLATFORMS, because both genuinely run green and because each one has caught
# something the other could not. macOS is what this is built on, and half the
# traps recorded in the code are macOS-only: nano is pico, BSD ps, no PRIMARY
# selection, pbcopy. Ubuntu is where the WSL2 users are, it ships tmux 3.4 against
# macOS's 3.7b, and that gap alone found two version-dependent bugs on the first
# run — a format operator that silently inverted the "your turn" gate, and
# Shift-Enter arriving in a different encoding depending on which tmux you had.
# A single-platform job would still be reporting both as fine.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Nothing from one person's machine ships (CONTRIBUTING.md, "Keeping it private"). Three checks:
  # gitleaks for credentials over the whole history, bin/leak-scan's public rules over the tree
  # and over the commits this run brings, and the maintainer's private denylist, which lives only
  # in the LEAK_DENYLIST secret. A PR from a fork or Dependabot gets no secrets, so it runs the
  # first two; the push to main after the merge runs all three.
  leaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                # gitleaks and --commits read history

      # From its own GitHub release at a reviewed version, checked against the hash in its
      # checksums file.
      - name: install gitleaks 8.30.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          gh release download v8.30.1 -R gitleaks/gitleaks -p gitleaks_8.30.1_linux_x64.tar.gz -O "$RUNNER_TEMP/gitleaks.tgz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | shasum -a 256 -c
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      # .gitleaksignore holds the findings read by hand and found harmless.
      - name: gitleaks, every commit
        run: gitleaks git --no-banner --redact .

      - name: leak-scan-probe
        run: bin/leak-scan-probe

      - name: leak-scan, tracked files
        run: bin/leak-scan

      # Older commits are what they are: author emails were not checked before this job, and the
      # history is not rewritten. Every commit from here on is.
      - name: the commits this run brings
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) range="$PR_BASE..$PR_HEAD" ;;
            push) if [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ] \
                     || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                    range="origin/main..$GITHUB_SHA"   # a new branch: what it adds over main
                  else
                    range="$BEFORE..$GITHUB_SHA"
                  fi ;;
            *) range= ;;
          esac
          echo "range: ${range:-none for a $EVENT run}"
          echo "RANGE=$range" >> "$GITHUB_ENV"

      - name: leak-scan, those commits
        if: env.RANGE != ''
        run: bin/leak-scan --commits "$RANGE"

      # The secret is written to a file only this job reads; leak-scan names a hit by its line in
      # that file, so the log never shows a private word. Missing on this repository is a failure,
      # not a skip: a scan that silently checks nothing is the leak this job exists to stop.
      - name: leak-scan, the private denylist
        env:
          LEAK_DENYLIST: ${{ secrets.LEAK_DENYLIST }}
          FORK: ${{ github.event.pull_request.head.repo.fork }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -z "$LEAK_DENYLIST" ]; then
            if [ "$FORK" = true ] || [ "$ACTOR" = "dependabot[bot]" ]; then
              echo "::warning::a fork's or Dependabot's run gets no Actions secrets: the private denylist runs on the push to main after the merge"
              exit 0
            fi
            echo "::error::the LEAK_DENYLIST secret is not set on this repository"
            exit 1
          fi
          printf '%s\n' "$LEAK_DENYLIST" > "$RUNNER_TEMP/leak-denylist"
          status=0
          bin/leak-scan --denylist "$RUNNER_TEMP/leak-denylist" || status=1
          if [ -n "$RANGE" ]; then
            bin/leak-scan --denylist "$RUNNER_TEMP/leak-denylist" --commits "$RANGE" || status=1
          fi
          rm -f "$RUNNER_TEMP/leak-denylist"
          exit "$status"

  probes:
    strategy:
      fail-fast: false                  # a macOS-only break must not hide a Linux one
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # Only what the probes reach for. micro and bat are deliberately absent:
      # the editor pane degrades to nano or vi and the preview to cat, which is
      # the documented behaviour and worth having a run that proves it.
      - name: install tmux, zsh, fzf, fd (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tmux zsh fzf fd-find
          mkdir -p ~/.local/bin && ln -sf "$(command -v fdfind)" ~/.local/bin/fd
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: install tmux, zsh, fzf, fd (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux fzf fd

      # herdr from its own GitHub release at a reviewed version, checked against a pinned hash:
      # preset-probe asks herdr itself which keys the preset really gives you.
      - name: install herdr 0.9.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64)   asset=herdr-linux-x86_64  sum=2a02fed16beb651ef006e1d43f048f652ca4dc58ad053cd2d44450563d5c54b7 ;;
            macOS-ARM64) asset=herdr-macos-aarch64 sum=5fc7a7e7adfaca56fa80aa89dcb025693357268dab8285b9ce2d08a2313c89de ;;
            *) echo "no pinned herdr for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/herdr-bin"
          gh release download v0.9.1 -R herdrdev/herdr -p "$asset" -O "$RUNNER_TEMP/herdr-bin/herdr"
          echo "$sum  $RUNNER_TEMP/herdr-bin/herdr" | shasum -a 256 -c
          chmod +x "$RUNNER_TEMP/herdr-bin/herdr"
          echo "$RUNNER_TEMP/herdr-bin" >> "$GITHUB_PATH"

      - name: versions
        run: |
          tmux -V && zsh --version && git --version && python3 --version && herdr --version

      # Cheap and catches most of it, which is why the legacy CONTRIBUTING asks for it
      # before a push. Here it gates the rest: a syntax error makes every probe
      # below fail in a way that reads like a real regression.
      - name: syntax
        run: |
          zsh -n office.zsh
          zsh -n bin/office-tmux
          zsh -n bin/attn-probe
          zsh -n bin/off-probe
          zsh -n bin/root-probe
          zsh -n bin/ctx-probe
          zsh -n bin/grid-probe
          zsh -n bin/agent-probe
          zsh -n bin/install-tmux
          sh -n install.sh
          sh -n bin/office-attn
          sh -n bin/office-ctx
          sh -n bin/office-cwd
          python3 -m py_compile bin/key-probe bin/mouse-probe bin/menu-probe preset/preset-probe \
            bin/office bin/install-probe bin/update-probe bin/notify-probe bin/dictate-probe bin/editor-probe bin/fm bin/fm-probe lib/agent_office/*.py \
            bin/officeoff-all bin/lifecycle-probe bin/leak-scan bin/leak-scan-probe bin/setup-probe bin/setup-home-probe \
            bin/setup-all-probe \
            setup/claude/hooks/agents-md.py
          sh -n .githooks/pre-push
          sh -n herdr/notify
          sh -n herdr/dictate
          sh -n herdr/editor
          sh -n herdr/nav
          sh -n herdr/nav-probe

      # tmux refuses to parse a config it cannot read, and a broken one would
      # otherwise only surface as "the keys do nothing" inside a probe.
      - name: the config loads
        run: |
          tmux -f /dev/null -L cfg new-session -d 'exec cat'
          tmux -L cfg source-file "$PWD/office.tmux.conf"
          tmux -L cfg source-file "$PWD/theme/office-theme.tmux.conf"
          tmux -L cfg list-keys -T prefix | grep -qE '^bind-key +-T prefix +n ' \
            || { echo "prefix n is not bound"; exit 1; }
          # the pane toggles are gone: a pane is whatever you pick from n
          if tmux -L cfg list-keys -T prefix | grep -qE "^bind-key +-T prefix +[scea] .*office"; then
            echo "a pane toggle key is back"; exit 1
          fi
          # No destructive action may sit behind one hard-coded letter again.
          # `confirm-before` takes exactly one key for yes -- y -- and on a
          # QWERTZ keyboard the key the hand reaches for sends z, so the prompt
          # closed and nothing happened. A menu is clickable and its shortcuts
          # (c/k) are on the same key on both layouts. This is a grep and not a
          # probe because it is the SHAPE that is wrong, not any one keystroke.
          tmux -L cfg list-keys -T prefix | grep -qE '^bind-key +-T prefix +q +display-menu' \
            || { echo "prefix q is not a menu"; exit 1; }
          tmux -L cfg list-keys -T prefix | grep -qE '^bind-key +-T prefix +X +display-menu' \
            || { echo "prefix X is not a menu"; exit 1; }
          # tmux's own prefix-& keeps its confirm-before and that is tmux's call,
          # not this config's. What may not come back is a confirm-before in
          # FRONT of a pane or a session, which is what these two keys close.
          if tmux -L cfg list-keys -T prefix | grep 'confirm-before' | grep -qE 'kill-pane|kill-session'; then
            echo "a confirm-before is back: one letter is gating a destructive action"; exit 1
          fi
          tmux -L cfg kill-server

      # The 1.0 installer and config, each case in its own throwaway HOME. Needs herdr, not a server.
      - name: install-probe
        run: bin/install-probe

      # macOS's own python3 is 3.9, which has no tomllib: the vendored reader has to carry it.
      - name: install-probe on the system Python 3.9 (macOS)
        if: runner.os == 'macOS'
        run: /usr/bin/python3 bin/install-probe

      # `office update`, each case in a throwaway HOME: fake brew, npm, herdr and curl on PATH, local
      # bare repositories as the remotes. Needs git and Python only; no network, no herdr.
      - name: update-probe
        run: bin/update-probe

      - name: update-probe on the system Python 3.9 (macOS)
        if: runner.os == 'macOS'
        run: /usr/bin/python3 bin/update-probe

      # setup/'s templates rendered for a stand-in user, the [setup] keys, and leak-scan over what
      # they render. Nothing is written into any home.
      - name: setup-probe
        run: bin/setup-probe

      - name: setup-probe on the system Python 3.9 (macOS)
        if: runner.os == 'macOS'
        run: /usr/bin/python3 bin/setup-probe

      # `office setup agents`, --check and --remove, each in a throwaway HOME with files of "yours".
      - name: setup-home-probe
        run: bin/setup-home-probe

      - name: setup-home-probe on the system Python 3.9 (macOS)
        if: runner.os == 'macOS'
        run: /usr/bin/python3 bin/setup-home-probe

      # `office setup`, the one-line install: every step in throwaway HOMEs, the questions on a pty.
      # Stand-in tools, a local Firstmate, a real herdr. No network, no server.
      - name: setup-all-probe
        run: bin/setup-all-probe

      - name: setup-all-probe on the system Python 3.9 (macOS)
        if: runner.os == 'macOS'
        run: /usr/bin/python3 bin/setup-all-probe

      # `office notify` and the herdr hook, against a fake ntfy on localhost. No server, no network.
      - name: notify-probe
        run: bin/notify-probe

      - name: notify-probe on the system Python 3.9 (macOS)
        if: runner.os == 'macOS'
        run: /usr/bin/python3 bin/notify-probe

      # `office dictate` and the herdr action, with stand-ins for rec, whisper-cli and herdr.
      # No microphone, no model, no server, no network.
      - name: dictate-probe
        run: bin/dictate-probe

      - name: dictate-probe on the system Python 3.9 (macOS)
        if: runner.os == 'macOS'
        run: /usr/bin/python3 bin/dictate-probe

      # `office editor`, the herdr action and the editor pane's pinned nvim plugins, with
      # stand-ins for herdr and the editors and a local plugin repository. No server, no network.
      - name: editor-probe
        run: bin/editor-probe

      - name: editor-probe on the system Python 3.9 (macOS)
        if: runner.os == 'macOS'
        run: /usr/bin/python3 bin/editor-probe

      # fm and fm restart against a herdr server of the probe's own, in a throwaway HOME, with a
      # stand-in Firstmate that herdr detects as claude.
      - name: fm-probe
        run: bin/fm-probe

      # office on, break, off, off --all and status against herdr sessions of the probe's own:
      # two owned offices and a foreign one, to prove a stop ends only what office on started.
      - name: lifecycle-probe
        run: bin/lifecycle-probe

      - name: lifecycle-probe on the system Python 3.9 (macOS)
        if: runner.os == 'macOS'
        run: /usr/bin/python3 bin/lifecycle-probe

      # The tmux office's (0.x) installer, until its last release is tagged.
      # A fresh HOME, so the installer is tested the way a stranger meets it:
      # nothing sourced yet, no ~/.tmux.conf, and it has to be safe to run twice.
      - name: install-tmux on a fresh HOME, twice
        run: |
          export HOME="$RUNNER_TEMP/fresh"
          mkdir -p "$HOME"
          bin/install-tmux
          bin/install-tmux
          test "$(grep -c 'office.zsh' "$HOME/.zshrc")" = 1
          test "$(grep -c 'source-file' "$HOME/.tmux.conf")" = 1
          test -L "$HOME/.local/bin/office"

      # ...and after the checkout MOVES, which is the case the installer used to be blind to: it
      # grepped for the CURRENT path, missed, and appended a second line below the dead one. The
      # machine that prompted this had been through two folder renames and was still sourcing
      # office.tmux.conf from a path retired months earlier -- so tmux used its own defaults, and
      # nothing said why. One line, pointing where the checkout actually is.
      - name: install-tmux after the checkout moves
        run: |
          export HOME="$RUNNER_TEMP/moved"
          mkdir -p "$HOME" "$RUNNER_TEMP/before"
          cp -R . "$RUNNER_TEMP/before/agent-office"
          (cd "$RUNNER_TEMP/before/agent-office" && bin/install-tmux)
          mv "$RUNNER_TEMP/before/agent-office" "$RUNNER_TEMP/after"
          (cd "$RUNNER_TEMP/after" && bin/install-tmux)
          test "$(grep -c 'source-file' "$HOME/.tmux.conf")" = 1
          test "$(grep -c 'office.zsh' "$HOME/.zshrc")" = 1
          grep -q "$RUNNER_TEMP/after/office.tmux.conf" "$HOME/.tmux.conf"
          grep -q "$RUNNER_TEMP/after/office.zsh" "$HOME/.zshrc"
          test "$(readlink "$HOME/.local/bin/office")" = "$RUNNER_TEMP/after/bin/office-tmux"

      # First, and needs no tmux server: it decides WHICH repo an office opens on, so a
      # break here makes every probe below open the right office on the wrong directory.
      - name: root-probe
        run: bin/root-probe

      # one pane that asks, then the grid: three across, two down, six in all
      - name: grid-probe
        run: bin/grid-probe

      - name: attn-probe
        run: bin/attn-probe

      - name: ctx-probe
        run: bin/ctx-probe

      # `office off` closes ONE office. It used to close every office on the
      # machine, agents mid-task included, and nothing here would have said so.
      - name: off-probe
        run: bin/off-probe

      - name: key-probe
        run: bin/key-probe

      - name: mouse-probe
        run: bin/mouse-probe

      - name: agent-probe
        run: bin/agent-probe

      # the menu draws only on a real client, so this one attaches one
      - name: menu-probe
        run: bin/menu-probe

      # herdr/meter against a fake herdr and fake transcripts; needs only sh and jq
      - name: meter-probe
        run: herdr/meter-probe

      # herdr/nav, the preset's Shift+arrow, against a fake herdr; needs only sh and jq
      - name: nav-probe
        run: herdr/nav-probe

      # the herdr preset against herdr's own check and defaults: no clash, the documented keys are
      # the real ones, the `office keys` sheet matches them, the Mac text keys pass through, nothing
      # private. Needs no herdr server.
      - name: close-tab-probe
        run: python3 preset/close-tab-probe

      - name: preset-probe
        run: preset/preset-probe

  # `office tools` for real, on a machine that has none of the pinned tools: the release assets
  # from GitHub with their SHA-256, the npm packages with --ignore-scripts, Homebrew for the rest.
  # The probes above feed it fake owners; this is the one run that proves the pins, the asset names
  # and the hashes in config/components.toml still exist out there, and that `office setup`, the
  # one-line install, works on a machine that has none of them. office tools itself fails when a
  # tool it installed is not on PATH or does not report the pinned version.
  downloads:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # the newest floor among the npm tools is Node 22.19 (quota-axi)
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ~/.local/bin on PATH, where the release tools go
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: none of the pinned tools is here yet
        run: |
          for t in herdr treehouse no-mistakes gh-axi quota-axi acpx; do
            if command -v "$t"; then echo "$t is already installed: this run would prove nothing"; exit 1; fi
          done

      - name: office tools --check installs nothing
        run: |
          bin/office tools --check
          ! command -v herdr

      # the one line a user runs after the clone. No coding agent is installed here, so herdr's
      # integration is left for the user and the run still ends well.
      - name: office setup
        run: |
          set -o pipefail
          bin/office setup --yes | tee "$RUNNER_TEMP/setup.txt"

      - name: every tool is installed, at its pin, and Firstmate is cloned
        run: |
          bin/office tools --check | tee "$RUNNER_TEMP/check.txt"
          grep -q '^Nothing to install' "$RUNNER_TEMP/check.txt"
          herdr --version && treehouse --version && no-mistakes --version
          git -C "$HOME/firstmate" rev-parse HEAD
          test -f "$HOME/AGENTS.md" && test -f "$HOME/.local/state/agent-office/herdr/config.toml"
          bin/office doctor | tee "$RUNNER_TEMP/doctor.txt" || true
          if grep -q 'not the pinned version' "$RUNNER_TEMP/doctor.txt"; then
            echo "office tools left a tool at another version than its pin"; exit 1
          fi

      - name: the skill packs, from their upstreams, match their pinned commits and SHA-256
        run: |
          set -o pipefail
          printf '[setup.skills]\nno_ai_slop = true\nmarketing = true\nbrag_slim = true\n' >> "$HOME/.config/agent-office/config.toml"
          bin/office setup agents --yes | tee "$RUNNER_TEMP/skills.txt"
          for s in no-ai-slop marketing brag-slim; do test -f "$HOME/.claude/skills/$s/SKILL.md"; done
          bin/office setup agents --check | tee "$RUNNER_TEMP/skills-check.txt"
          grep -q '^Nothing to change' "$RUNNER_TEMP/skills-check.txt"
          # every upstream skill the marketing skill names is in the pinned commit
          pack="$HOME/.local/share/agent-office/vendors/marketingskills/skills"
          for s in $(sed -n 's/^- [^:]*: //p' setup/skills/marketing/SKILL.md | tr -d ','); do
            test -f "$pack/$s/SKILL.md" || { echo "setup/skills/marketing/SKILL.md names $s, not in the pack"; exit 1; }
          done
