# Agent Office herdr preset. The daily look and keys of the office, as a herdr config.toml.
# Copy this file and the sounds/ folder next to it into ~/.config/herdr/ (see preset/README.md).
# Every key herdr does not set here keeps herdr's default; preset/README.md lists the effective
# keys and preset/preset-probe checks that list against herdr itself.
#
# `onboarding` is left out on purpose: a new user still gets herdr's first-run setup. Once you
# have chosen, add `onboarding = false` yourself, as herdr's own default config says.

# No mouse needed. Shift+arrow (no prefix) walks everything, through the meter plugin's nav
# action (herdr/nav): a herdr key has one action, and plain pane focus stops at the edge.
#   Shift+left / right   the pane on that side, then the tab before / after
#   Shift+up / down      the pane on that side, then the space above / below
#   Ctrl+Space then:
#     n / N              new space / new tab         c / C  close space / tab (both ask)
#     r / R              rename space / tab          q      close pane
#     v / -              new pane right / below      z      zoom     Shift+arrow  swap pane
#     g                  go to any agent             o      the agent that needs you
#     l                  last pane                   arrow  pane only
#     Space / p          next / previous tab         1..9   tab by number
#     s                  settings                    a      adjust pane size (resize mode)
#     Enter              copy mode                   d      leave herdr (keeps running)
#     m                  dictate: press, talk, press (opt-in, [dictate] in your config)
#     ?                  all keys
# Small letter for the space, capital for the tab: a space holds tabs, so it is the bigger step.
# Ctrl+Space and not herdr's Ctrl+B: Ctrl+B is "back one character" in the shell and in the
# agents' prompts. Nothing here binds Ctrl+A/E/U/W or Alt+B/F, because the WezTerm example's
# Mac text keys send exactly those bytes to the agent and herdr must let them through.
# Shift+arrow, prefix+arrow and Ctrl+Space come from the tmux office, so muscle memory carries over.
[keys]
prefix = "ctrl+space"
focus_pane_left  = "prefix+left"
focus_pane_right = "prefix+right"
focus_pane_up    = "prefix+up"
focus_pane_down  = "prefix+down"
swap_pane_left   = "prefix+shift+left"
swap_pane_right  = "prefix+shift+right"
swap_pane_up     = "prefix+shift+up"
swap_pane_down   = "prefix+shift+down"
new_workspace    = "prefix+n"
new_tab          = "prefix+shift+n"
close_workspace  = "prefix+c"
close_tab        = ""  # the popup below asks before closing
rename_workspace = "prefix+r"
rename_tab       = "prefix+shift+r"
close_pane       = "prefix+q"
# herdr's defaults, set here because the key strip in [ui] names them
zoom             = "prefix+z"
help             = "prefix+?"
last_pane        = "prefix+l"
split_vertical   = "prefix+v"
split_horizontal = "prefix+minus"
resize_mode      = "prefix+a"
# herdr's default prefix+shift+r is rename_tab here. Reload from the settings menu (prefix+s),
# or with `herdr server reload-config`.
reload_config    = ""
detach           = "prefix+d"
next_tab         = "prefix+space"
copy_mode        = "prefix+enter"

# shortcut: herdr's tab menu still closes directly; remove this binding when upstream adds tab confirmation.
[[keys.command]]
key = "prefix+shift+c"
type = "popup"
description = "Close tab (asks first)"
width = 64
height = 8
command = '''
printf '\n Close this tab and all its panes? (%s)\n\n Type y then Enter to close. Enter cancels: ' "${HERDR_ACTIVE_TAB_ID:?}"
IFS= read -r answer || exit 0
[ "$answer" = y ] || exit 0
if ! "${HERDR_BIN_PATH:-herdr}" tab close "$HERDR_ACTIVE_TAB_ID"; then
  printf '\n Tab was not closed. Press Enter to dismiss. '
  IFS= read -r answer
fi
'''

# office open's picker in a popup: fzf over the projects, then the project's space. A cancelled
# pick (Esc, exit 130) closes it at once; anything else that failed stays up to be read.
# `command`, because a shell that still loads the tmux office's `office` function would run that.
[[keys.command]]
key = "prefix+f"
type = "popup"
description = "open a project"
width = 100
height = 24
command = '''
if ! command -v office >/dev/null 2>&1; then
  printf '\n office is not on the PATH herdr started with. Press Enter. '
  IFS= read -r answer
  exit 0
fi
command office open
rc=$?
if [ "$rc" -ne 0 ] && [ "$rc" -ne 130 ]; then
  printf '\n Press Enter to dismiss. '
  IFS= read -r answer
fi
'''

[[keys.command]]
key = "shift+left"
type = "plugin_action"
command = "agent-office.meter.nav-left"
description = "pane on the left, then the tab before"

[[keys.command]]
key = "shift+right"
type = "plugin_action"
command = "agent-office.meter.nav-right"
description = "pane on the right, then the tab after"

[[keys.command]]
key = "shift+up"
type = "plugin_action"
command = "agent-office.meter.nav-up"
description = "pane above, then the space above"

[[keys.command]]
key = "shift+down"
type = "plugin_action"
command = "agent-office.meter.nav-down"
description = "pane below, then the space below"

# Push-to-talk into the focused pane: off until [dictate] is on in your Agent Office config.
# herdr has no key-up, so the first press records and the second types the words (herdr/dictate).
[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "agent-office.meter.dictate"
description = "dictate: press, talk, press again to type it"

[ui]
# Agents panel grouped by space. herdr's default too, kept explicit because it is a choice
# (the other one, "priority", reorders the list as agents change state).
agent_panel_sort = "spaces"

# The key strip, at the right end of the tab row. herdr's own prefix bar names four keys and
# cannot be changed, so the keys you press most stay on screen here: Ctrl+Space, then the
# key. A capital letter is the key with Shift. Shift+arrow needs no prefix, so it comes first. herdr hides the strip, and the ZOOM pill with
# it, when the tabs need the room; a zoomed tab still shows its own Z.
# The text is the [keys] above in one line. `office install` writes it again from the keys
# you rebind in [herdr.keys]; by hand, change both. preset/preset-probe checks they agree.
tab_bar_right = [
  { type = "zoom" },
  { type = "text", text = "⇧ arrows move │ ^Space  n new space · N new tab · v split · q close pane · z zoom · ? keys" },
]
tab_bar_right_separator = "  "

# Only "needs you" plays a sound. A worker finishing is routine under Firstmate, so its sound is
# a silent mp3: herdr has no per-event off switch, and done_path overrides only the finished
# sound. Relative paths resolve from this file's folder, so sounds/ travels with it.
[ui.sound]
enabled = true
done_path = "sounds/silent.mp3"

# Row 1 is herdr's state icon and the space name. Row 2 reads "claude · 412k▲ · 47m · idle":
# the agent, its context size and its transcript age (how long since it last wrote anything), then
# herdr's own state word. The state goes last because row 1's icon already
# shows it, so a long row trims only that word in the 26-column sidebar.
#
# $ctx and $turn come from the Agent Office meter (herdr/); without it they stay blank.
# Context: green, amber once the meter adds ▲, red with ▲▲ (the meter decides when, per model).
# Transcript age: green under 30m, amber 30-44m, red from 45m and on every whole hour ("2h"): a
# desk idle that long is worth a look. It says nothing about a provider's cache or billing, which
# the meter cannot see. herdr rules have no regex, so the minutes are matched as text, and the
# bare "3m" / "4m" / "5m" rules stop a few minutes from matching the 30s-50s rules below them.
#
# Row 3 reads "89% · #109 · fix/login", also from the meter: the quota left on the agent's
# provider (green, amber once ▼ says it runs out before the limit resets, red with ▼▼ when it is
# out), the open PR, and the branch. The branch goes last because it is the longest.
[ui.sidebar.agents]
rows = [
  ["state_icon", "workspace"],
  ["agent",
   { token = "$ctx", fg = "#6FA37A", rules = [{ contains = "▲▲", fg = "#C25450", bold = true }, { contains = "▲", fg = "#C9903F" }] },
   { token = "$turn", fg = "#6FA37A", rules = [
     { contains = "h", fg = "#C25450", bold = true },
     { starts_with = "45", fg = "#C25450", bold = true },
     { starts_with = "46", fg = "#C25450", bold = true },
     { starts_with = "47", fg = "#C25450", bold = true },
     { starts_with = "48", fg = "#C25450", bold = true },
     { starts_with = "49", fg = "#C25450", bold = true },
     { equals = "5m" },
     { starts_with = "5", fg = "#C25450", bold = true },
     { equals = "3m" },
     { starts_with = "3", fg = "#C9903F" },
     { equals = "4m" },
     { starts_with = "4", fg = "#C9903F" }] },
   { token = "state_text", fg = "#9a9ca6", dim = true }],
  [{ token = "$quota", fg = "#6FA37A", rules = [{ contains = "▼▼", fg = "#C25450", bold = true }, { contains = "▼", fg = "#C9903F" }] },
   { token = "$pr", fg = "#f6f5f1" },
   { token = "$branch", fg = "#9a9ca6", dim = true }],
]

# Zyx look, same palette as theme/office-theme.tmux.conf.
# Monochrome by conviction: state is tone, not hue.
# Amber (#C9903F) means "this needs you". Red (#C25450) means "act on this".
[theme]
name = "catppuccin"
auto_switch = false

[theme.custom]
panel_bg      = "#0b0c10"   # ink
sidebar_bg    = "#0e1016"   # band
active_row_bg = "#16181f"   # panel
selection_bg  = "#2a2d36"   # raised chip
surface0      = "#16181f"
surface1      = "#2a2d36"
surface_dim   = "#0e1016"
overlay0      = "#4e505a"   # hairlines only
overlay1      = "#6a6c77"
text          = "#f6f5f1"
subtext0      = "#9a9ca6"
accent        = "#C9903F"
yellow        = "#C9903F"
peach         = "#C9903F"
red           = "#C25450"
green         = "#f6f5f1"   # done = bright tone, not a hue
blue          = "#9a9ca6"
teal          = "#9a9ca6"
mauve         = "#8a8d96"
