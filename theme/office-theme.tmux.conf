# office-theme.tmux.conf — optional. The look, separated from the behaviour.
#
#   source-file /path/to/agent-office/office.tmux.conf        # required
#   source-file /path/to/agent-office/theme/office-theme.tmux.conf   # this, if you want it
#
# Source it AFTER office.tmux.conf: it overrides the pane-border-format, and it
# keeps the two things office needs from that border (@office_num and the
# derived label), so the override is safe.
#
# The idea, in case you want to bend it: monochrome by conviction. State is
# TONE, WEIGHT and INVERSION, never hue. Two colours exist and they are a LADDER,
# not a palette: $ACCENT means "this needs you" and $ALARM means "act on this".
# Nothing else on the screen may have either. A third would make the first two
# decorative, which is how a bar ends up with five colours and no meaning.
#
# Today that is: ACCENT for a desk waiting on you and for a context window past
# the warn mark, ALARM for one past the alarm mark. Every other state is tone.

# --- the palette -------------------------------------------------------------
INK="#f6f5f1"       # primary text
MUTED="#9a9ca6"     # secondary
KICKER="#8a8d96"    # labels
DIM="#6a6c77"       # meta. The contrast floor for small text
FAINT="#4e505a"     # hairline furniture ONLY, never text
BAND="#0e1016"      # the bar
PANEL="#16181f"     # panels
ACTIVE="#2a2d36"    # a raised chip
ACCENT="#C9903F"    # "this needs you." Soon, or now if you have a minute
ALARM="#C25450"     # "act on this." The only colour above ACCENT, and the last one

# --- the bar -----------------------------------------------------------------
# Everything lives on the RIGHT. The left is deliberately quiet: that is where
# tmux draws the command prompt, and a logo is not worth the space you type in.
set -g status-position bottom
set -g status-justify right
set -g status-interval 5
set -g status-style "bg=$BAND,fg=$MUTED"

# ...except the keys: n new, x park, q close, z zoom, and how to move. All dim;
# the parked count is a shade brighter, because a parked pane is running and
# nothing else on screen shows it. WHITE is the last tone, and it means one
# thing: the way back out of a state you are in - today only zoom, where every
# other pane is hidden. Clicking the bar opens the same list as Ctrl-Space n.
#
# @office_bar is written by office itself, not polled with #(): a polled job is
# always one interval behind, so the bar would keep calling a pane open until
# the next tick.
# The fallback matters: @office_bar does not exist until office writes it, and
# a bar that is briefly blank looks like a broken config.
#
# `#{E:` and not `#{`: E expands the option's own formats, and the plain form
# does not. The strip carries one conditional that only tmux can answer - the
# zoom key, which has to go white the moment a window is zoomed by a key office
# never sees - and through `#{@office_bar}` that conditional is printed
# LITERALLY on the bar (checked on tmux 3.7b). Keep the E.
#
# The leading space is the left screen edge. The right end of the bar has always
# had one; without it the prefix sits flush against the frame.
set -g status-left " #[range=user|task]#{?@office_bar,#{E:@office_bar},#[fg=#9a9ca6]+ new ^Space n}#[norange] "
# 120, not 100: the strip is 100 cells wide flat and GROWS to 102 when a window
# is zoomed (`z zoom` becomes `z unzoom`), so 100 truncated the move hint off the
# end at exactly the moment the bar is trying to tell you how to get back. This
# is the visible cell count, measured, not the byte length. Matches the right.
set -g status-left-length 120
# 'task', not 'user': for a `range=user|X` range tmux hands X — the range's
# NAME — to mouse_status_range, not the word "user". Compared against "user"
# this never matched, so the advertised click-to-open silently select-window'd.
bind -n MouseDown1Status if -F '#{==:#{mouse_status_range},task}' \
  { run-shell -b "OFFICE_PANE_PATH=\"#{pane_current_path}\" OFFICE_CLIENT=\"#{client_name}\" OFFICE_SESSION=\"#{session_name}\" zsh -ic 'office new' >/dev/null 2>&1 || true" } \
  { select-window -t= }

# Right: the branch, then the clock. Nothing else, on purpose.
#
# This is YOUR bar. To put your own things here, add one line to your
# ~/.tmux.conf AFTER the source-file line for this theme, and it wins:
#
#   set -g status-right "#[fg=#f6f5f1]#(~/bin/my-status)  #[fg=#6a6c77]%H:%M "
#
# Anything in #() runs every status-interval (5s here) and its first line is
# printed. Keep it fast and keep it one line. An earlier version of this file
# read an $OFFICE_STATUS_CMD variable, which looked tidier and did not reliably
# work: tmux runs #() with the SERVER's environment, so a variable exported in
# your shell after the server started is simply not there.
set -g status-right-length 120
set -g status-right "#[fg=$INK,bold]#{?client_prefix,PREFIX  ,}#[fg=$KICKER]#(cd '#{pane_current_path}' 2>/dev/null && git branch --show-current 2>/dev/null)  #[fg=$FAINT]─ #[fg=$DIM]%H:%M #[fg=$KICKER]%d.%m "

# Windows. The name only earns its place once there is more than one office.
# No zoom glyph on the window you are IN: the white `z unzoom` on the bar says
# the same thing and says the way out with it, and two marks for one state is
# one mark too many. Another window keeps its glyph - that one has nothing else
# announcing it, and you cannot unzoom a window you are not in anyway.
# " Z", tmux's own letter for the state — a bare space here was invisible,
# which is no glyph at all.
setw -g window-status-format "#[fg=$DIM] #W#{?window_zoomed_flag, Z,} "
setw -g window-status-current-format "#[fg=$KICKER] #{?#{>:#{session_windows},1},#W,} "
setw -g window-status-separator ""
setw -g window-status-activity-style "fg=$INK,bold"

# --- panes -------------------------------------------------------------------
# Hairline borders. The active pane steps forward in tone, not in colour.
set -g pane-border-style "fg=$ACTIVE"
set -g pane-active-border-style "fg=$MUTED"
set -g pane-border-lines single
set -g pane-border-status top
# This is what $ACCENT was reserved for, and until now nothing used it: ONE
# colour on the whole screen, and it means "this needs you". A desk that has
# stopped moving is the only thing in the office that is true of, so it gets the
# gold and nothing else ever does. office.tmux.conf owns the wiring; this line
# is only the tone it arrives in.
set -g @office_attn_style "#[fg=$ACCENT,bold]"
# The context window, on the same ladder. Under the warn mark it is furniture and
# gets $DIM — a number you can read when you look for it and never notice
# otherwise. Over it, it is a decision, so it climbs: ACCENT, then ALARM.
set -g @office_ctx_style_warn "#[fg=$ACCENT]"
set -g @office_ctx_style_alarm "#[fg=$ALARM,bold]"
# Keeps all four things office needs: @office_num, a label derived from pane_title
# so it cannot go stale, and @office_ctx then @office_attn at the end. See
# office.tmux.conf for why each one matters.
set -g pane-border-format "#[fg=#{?pane_active,$BAND,$KICKER},bg=#{?pane_active,$MUTED,$PANEL},bold] #{?@office_num,#{@office_num},#{pane_index}} #[fg=#{?pane_active,$INK,$KICKER},bg=$BAND,nobold] #{?@office_label,#{@office_label},#{pane_current_command}}#[fg=$DIM]#{?#{||:#{==:#{pane_title},#{host}},#{==:#{pane_title},#{host_short}}},,#{?@office_label, · #{=32:pane_title},}}#[fg=$DIM]#{E:@office_ctx}#{E:@office_attn} "

# --- messages and modes ------------------------------------------------------
set -g message-style "bg=$PANEL,fg=$INK"
set -g message-command-style "bg=$PANEL,fg=$INK"
set -g mode-style "bg=$ACTIVE,fg=$INK"
set -g clock-mode-colour "$INK"
set -g clock-mode-style 24
set -g display-time 2000
