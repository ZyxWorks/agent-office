# The components of the office: what `office doctor` checks, the versions this release is tested
# with, and how `office tools` installs one that is missing.
#
# command:  the program looked up on PATH. Its `--version` gives the installed version
#           (`version_args` when a program takes something else, as tmux takes -V).
# update:   the command a component updates itself with, when it is not installed by a package
#           manager. Shown as who owns updates; office doctor never runs it.
# tested:   the versions verified with this release. Any other version is reported as a problem.
#           [] means none verified yet. No `tested` key means no version is pinned.
# pin:      the version `office tools` installs: one that was read before it was trusted. Without
#           `tested`, office doctor reports any other installed version as a problem.
# profile:  "workstation" is the optional set, `office tools --workstation`: generic command-line
#           tools. office doctor lists the ones you have and does not miss the rest.
#
# How `office tools` installs one, always through the tool's own owner, so the owner updates it:
#   release = the owner's GitHub release asset at `pin`, checked against its SHA-256 before it is
#             unpacked, into the folder the owner's own installer uses. Never a script from the
#             internet piped into a shell.
#   npm     = `npm install -g --ignore-scripts <npm>@<pin>`: no package's install scripts run.
#             `node` is the oldest Node the package says it runs on.
#   brew    = `brew install <brew>` (or `brew install --cask`): Homebrew owns the version.
#
# A version goes into `tested` only with the run that verified it, named in a comment. A `pin`
# moves only after the new release was read; its hashes come from the release's own checksums.

schema = 1

# --- the agent toolkit: `office tools` -------------------------------------------------------

[[component]]
name = "herdr"
command = "herdr"
update = "herdr update"
tested = ["0.9.1"]            # CI pins it: install-probe, preset-probe and meter-probe
pin = "0.9.1"

[component.release]
url = "https://github.com/herdrdev/herdr/releases/download/v0.9.1/"
dir = "~/.local/bin"
darwin-arm64 = { asset = "herdr-macos-aarch64", sha256 = "5fc7a7e7adfaca56fa80aa89dcb025693357268dab8285b9ce2d08a2313c89de" }
darwin-amd64 = { asset = "herdr-macos-x86_64", sha256 = "053be0639935fe54ab5efbdb46651054e4f6a753a5b43153c88bd6912bce1e94" }
