id = "agent-office.meter"
name = "Agent Office meter"
version = "0.6.0"
min_herdr_version = "0.9.0"
description = "Context size, model, transcript age, quota runway, git branch and open PR for Claude Code and Codex panes, on the sidebar, an opt-in phone push when an agent needs you, one key to walk panes, tabs and spaces, opt-in local dictation and an opt-in editor pane"
platforms = ["linux", "macos"]

[[startup]]
command = ["sh", "start"]

[[actions]]
id = "refresh"
title = "Refresh meter now"
contexts = ["workspace"]
command = ["sh", "meter", "once"]

# Shift+arrow in the preset: see nav
[[actions]]
id = "nav-left"
title = "Go left: pane, then the tab before"
contexts = ["workspace"]
command = ["sh", "nav", "left"]

[[actions]]
id = "nav-right"
title = "Go right: pane, then the tab after"
contexts = ["workspace"]
command = ["sh", "nav", "right"]

[[actions]]
id = "nav-up"
title = "Go up: pane, then the space above"
contexts = ["workspace"]
command = ["sh", "nav", "up"]

[[actions]]
id = "nav-down"
title = "Go down: pane, then the space below"
contexts = ["workspace"]
command = ["sh", "nav", "down"]

# prefix+m in the preset; off unless [dictate] is on in your Agent Office config.toml; see dictate
[[actions]]
id = "dictate"
title = "Dictate: record, then type the words into this pane"
contexts = ["workspace"]
command = ["sh", "dictate"]

# prefix+i in the preset; off unless [editor] is on in your Agent Office config.toml; see editor
[[actions]]
id = "editor"
title = "Editor: open one next to this pane, in its worktree"
contexts = ["workspace"]
command = ["sh", "editor"]

# off unless [notify] is on in your Agent Office config.toml; see herdr/notify
[[events]]
on = "pane.agent_status_changed"
command = ["sh", "notify"]
