id = "agent-office.meter"
name = "Agent Office meter"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Context size and 'your turn' clock for each Claude Code pane, on the sidebar"
platforms = ["linux", "macos"]

[[startup]]
command = ["sh", "start"]

[[actions]]
id = "refresh"
title = "Refresh meter now"
contexts = ["workspace"]
command = ["sh", "meter", "once"]
