# office.tmux.conf — the tmux half of `office`.
#
#   source-file ~/path/to/office/office.tmux.conf
#
# Bindings and behaviour only. No colours: your theme stays yours. If you set
# pane-border-format yourself, set it AFTER sourcing this file and keep the
# @office_label / @office_kind bits, or the pane labels go blank.

# --- prefix ------------------------------------------------------------------
# Ctrl-Space, because Ctrl-b is a cursor key and Ctrl-a belongs to the shell.
# NOTE on macOS: "select the previous input source" also defaults to Ctrl-Space.
# With two keyboard layouts installed, turn that off or the prefix goes dead.
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# --- core behaviour ----------------------------------------------------------
set -g mouse on                       # click to focus, drag to copy, borders drag to resize
set -g history-limit 100000
# 50ms, not the 5 this used to be. Shift-Left is ESC [ 1 ; 2 D, and if the ESC
# and the rest arrive more than escape-time apart, tmux reads a lone Escape
# followed by five literal characters and types "[1;2D" into your agent. Five
# milliseconds is under tmux's own default of 10, and spawning a 600MB agent is
# exactly the CPU spike that splits a sequence. 50ms is still far below the
# ~200ms where a human notices Esc lag.
set -sg escape-time 50
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi
set -g status-keys emacs        # so Escape leaves a prompt instead of entering vi mode
set -g detach-on-destroy off
# keep the labels office sets; nothing else may rename panes or windows
set -g allow-rename off
setw -g automatic-rename off
set -g pane-border-status top
# 5, not tmux's default 15. This is the only clock tmux has: it is what re-runs
# a #() in any format, and the "your turn" watcher on the pane border rides it.
# At 15 a desk that had been waiting 20 seconds could take 35 to say so.
set -g status-interval 5

# --- true colour -------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm-256color:Tc,alacritty:Tc"
set -ga terminal-features ",*:usstyle"

# --- the keys the office must NOT eat ----------------------------------------
# tmux's legacy encoding has no byte for Shift-Enter, Ctrl-Enter or any other
# modified key that ASCII never had one for, so without this the pane is handed
# a bare \r and every one of them collapses into plain Enter. That is why
# Shift-Enter stops making a line break in Claude Code the moment you are in the
# office and works everywhere else: the app is fine and the terminal is fine,
# tmux in the middle is dropping the modifier on the floor.
#
# `extkeys` is what makes tmux ask the OUTER terminal for those keys, and
# `always` is what makes it pass them on. Not `on`: `on` forwards them only to
# an app that asked in tmux's own dialect, and an app asking for the kitty
# keyboard protocol (\e[>1u, which is what Claude Code sends) gets no answer and
# is left believing the terminal is legacy.
#
# Nothing else changes, and that is the part worth checking rather than
# believing. Probed through a throwaway server with `always` set: Enter is still
# \r, Tab \t, Backspace \x7f, Ctrl-C \x03, Ctrl-A \x01, Ctrl-D \x04, Escape
# \x1b, Shift-Left still CSI 1;2D, letters still letters. The ONLY keys that
# change are the ones that had no encoding to lose: Shift-Enter becomes
# CSI 27;2;13~ and Ctrl-Enter CSI 27;5;13~.
#
# WHICH ENCODING those keys arrive in is tmux's business and not ours, and this
# is the note that stops someone "fixing" it twice. It depends on the version:
# 3.4 sends Shift-Enter as CSI 13;2u, 3.5 and later as CSI 27;2;13~, because that
# is when extended-keys-format arrived and its default is xterm. Setting the
# option here would be a no-op on 3.5+ and an error on 3.4 — a literal
# "invalid option: extended-keys-format" printed into every reload, which is
# worse than the difference it would not have fixed. So: not set, on purpose.
#
# It costs nothing that anyone can feel, because an app that negotiated extended
# keys at all reads both forms — Claude Code does. What matters is that the
# modifier SURVIVES, which is `always` below, and bin/key-probe accepts either
# encoding for exactly this reason.
set -s extended-keys always
set -as terminal-features ",xterm*:extkeys"

# =============================================================================
# THE KEYS. Five things you can do to a pane, and nothing else.
#
#   Shift-arrows           move between panes
#   Ctrl-Space, then:      n new pane (an agent, a shell, the editor, or a
#                            parked pane back)
#                          x park      q close      z zoom
#   drag a pane's title    onto another pane: it moves there, the rest shift
#   drag across text       it is on the clipboard when you let go, and a
#                          double-click takes the word, a triple-click the line
#
# Movement is one chord because it is what you do most. Everything else is the
# prefix, which is the tmux convention, works identically on macOS, Linux and
# Windows, and needs no terminal configuration at all.
#
# ONE key per action, and no second way to do anything. Every alias this used to
# carry for fingers trained on an older scheme is gone: they cost a line in the
# key bar, a row in every table, and a reader wondering which one is real.
#
# Shift-arrow is CSI 1;2 A-D, which every terminal already sends. Nothing to
# install on any platform.
# =============================================================================

# Retired schemes. `source-file` only ADDS bindings, so a live server keeps
# whatever it learned earlier: drop them by name or a reload resurrects them.
unbind -n M-Left ; unbind -n M-Right ; unbind -n M-Up ; unbind -n M-Down
unbind -n M-h ; unbind -n M-j ; unbind -n M-k ; unbind -n M-l
# ...including the Ctrl-Shift LETTER chords this used to have. They needed a
# per-terminal translation layer to exist at all, which is exactly the setup
# step nobody should need, so the actions moved to the prefix.
unbind -n M-a ; unbind -n M-c ; unbind -n M-e ; unbind -n M-n ; unbind -n M-s
unbind -n M-t ; unbind -n M-w ; unbind -n M-x ; unbind -n M-z
# ...and the second keys that used to do what one key does now: w closed a pane
# alongside q, t opened a session alongside n, and h j k l moved alongside the
# prefix arrows. One action, one key. Dropped by name for the same reason as
# everything above: a running server keeps what it learned until told otherwise.
unbind w ; unbind t ; unbind h ; unbind j ; unbind k ; unbind l
# Movement is Shift-arrow, and it is the only chord in the whole scheme.
#
# Every terminal on every OS sends Shift-arrow natively as CSI 1;2 A-D, so this
# needs nothing installed and clashes with nothing the OS claims: not macOS
# Mission Control (Ctrl-arrow), not word-jump (Option-arrow), and it does not
# need Ctrl-Shift, which no terminal can send for a letter anyway.
#
# The one thing Shift-arrow normally does is select text, and that matters only
# while a file is actually OPEN. tmux can see the difference: the pane reports
# `micro` with a file open and `zsh` while the file list is showing. So the file
# list moves you like every other pane, and only an open file keeps the key.
#
# Gating on the pane KIND instead would trap you in the file list, which is
# where you spend most of your time in that pane.
#
# Inside an open file: Ctrl-Q closes it back to the list, or Ctrl-Space and an
# arrow moves out directly. The prefix always wins, from anywhere.
_ED='#{m/r:^(micro|nano|pico|vim|nvim|vi|view|hx|helix|emacs|kak|ne|joe),#{pane_current_command}}'
bind -n S-Left  if -F "$_ED" 'send-keys S-Left'  'select-pane -L'
bind -n S-Right if -F "$_ED" 'send-keys S-Right' 'select-pane -R'
bind -n S-Up    if -F "$_ED" 'send-keys S-Up'    'select-pane -U'
bind -n S-Down  if -F "$_ED" 'send-keys S-Down'  'select-pane -D'
# The old Ctrl-Shift-arrows are GONE, not kept as a courtesy. They were the one
# reason this project asked you to install a key map into your terminal at all,
# and Shift-arrow does the same job with nothing to set up.
unbind -n C-S-Left ; unbind -n C-S-Right ; unbind -n C-S-Up ; unbind -n C-S-Down
bind -T copy-mode-vi S-Left  { send -X cancel ; select-pane -L }
bind -T copy-mode-vi S-Right { send -X cancel ; select-pane -R }
bind -T copy-mode-vi S-Up    { send -X cancel ; select-pane -U }
bind -T copy-mode-vi S-Down  { send -X cancel ; select-pane -D }

# Every office command is silenced. Stray output from a keybinding makes tmux
# force the active pane into view-mode, where these keys all stop working.
# n is a new session, focused, ready for you to describe the task in the agent's
# OWN input. (A second key, t, used to do exactly this as well; one action, one
# key.) It used to open a tmux prompt on the
# status bar, which was worse in three ways at once: tmux prompts take text and
# never an image or a dropped file, Escape does not reliably leave them, and you
# cannot move between them and a pane. A pane has none of those problems.
# q closes, x parks. Both ask nothing back except this one confirmation.

# --- the actions: prefix, then one letter ------------------------------------
# Ctrl-Space, then the letter. This is the tmux convention, it needs no terminal
# configuration on any platform, and a prefix-table binding shadows nothing you
# would otherwise press. The letters match the names, so there is one thing to
# remember per action rather than a chord per action.
# n is `office new`, not `office desk`: the session it opens gets its OWN git
# worktree, and only falls back to this checkout when git cannot give it one.
# The key you press twenty times a day used to be the one that put a second
# agent in the checkout you are already in — same branch, same files, each
# committing over the other, and both borders reading CLAUDE so nothing on
# screen said so. `office desk` is still that, typed, when you mean it.
# The pane's path is HANDED to office, never cd'd into here. These lines used to
# read `cd "<pane path>" && office …`, and a pane standing in a directory that
# is GONE — a session worktree reaped while its agent was still sat in it —
# failed that `cd`, which took the whole line with it. Every one of these keys
# went dead in that pane at once, and none of them said so, because the output
# is muted on purpose. `_office_pane_cwd` walks up to a directory that is there.
# OFFICE_CLIENT rides along too: two or more OFFICE_AGENTS makes `office new`
# show a picker, and `display-menu` needs a client to draw on that a detached
# run-shell binding does not have of its own.
bind n run-shell -b "OFFICE_PANE_PATH=\"#{pane_current_path}\" OFFICE_CLIENT=\"#{client_name}\" OFFICE_SESSION=\"#{session_name}\" zsh -ic 'office new' >/dev/null 2>&1 || true"
# The pane toggles are GONE: s (shell), e (editor), c (chat) and a (all
# sessions) each opened or parked one fixed pane in one fixed place, and a pane
# is now whatever you pick from n. Dropped by name, because `source-file` only
# ADDS: a running server keeps what it learned until told otherwise. c and s were
# tmux's own new-window and choose-tree; one window is the whole office.
unbind s ; unbind e ; unbind c ; unbind a
bind x run-shell -b "zsh -ic 'office hide #{pane_id}'                          >/dev/null 2>&1 || true"
# q closes, and it is the ONLY key that closes. This used to answer to w as well
# (the Cmd-W convention) with q there for vim fingers; two keys for one action is
# a key bar that has to pick one and a table that lists both. q is what the hand
# reaches for. The casualties are tmux's own prefix-q (display-panes, which the
# pane numbers on the borders show you permanently anyway) and prefix-w (the
# window list, which prefix-S covers).
# A MENU, and not `confirm-before`. The old line asked "close this pane? (y/n)"
# and tmux accepts exactly ONE key for yes: the letter y. On a German QWERTZ
# keyboard y and z are swapped, so the key the hand reaches for sends z, tmux
# reads anything that is not y as "no", the prompt closes and NOTHING happens.
# Twice, three times, and the office looks broken while the config is fine. The
# bug is not the layout — it is a destructive action gated behind one hard-coded
# letter on a tool that ships to whatever keyboard is in front of it.
#
# A menu takes the CLICK instead, which needs no letter at all, and that is what
# -M is for: without it tmux only lets menus opened FROM a mouse binding handle
# the mouse, so this one would draw and then ignore every click on it. Escape
# and Enter both close it without doing anything, so the reflex press is the
# safe one. c and k stay as shortcuts, and both sit on the same key on QWERTY
# and QWERTZ, which is the whole point.
# -M is tmux 3.5 and newer. On 3.4 the flag does not exist, tmux refuses the
# line, and prefix-q is left bound to NOTHING -- measured on Ubuntu's 3.4, which
# is what the WSL2 users have. So the version is asked once and each tmux gets
# the shape it has: older ones keep the menu and lose only the click, which is
# the half c and Escape already cover.
# ponytail: a numeric compare, so a future tmux 3.10 would read as 3.1 and quietly
# drop back to the keyboard-only menu. One digit to fix on the day that ships.
if -F "#{>=:#{version},3.5}" {
  bind q display-menu -M -T "#[align=centre] close this pane? " -x P -y P \
    " keep it"     k "" \
    ""             "" "" \
    " close it"    c "kill-pane"
} {
  bind q display-menu -T "#[align=centre] close this pane? " -x P -y P \
    " keep it"     k "" \
    ""             "" "" \
    " close it"    c "kill-pane"
}
bind z resize-pane -Z
# q closes and x parks, matching the words used everywhere else. That moves
# tmux's own prefix-x off kill-pane, which is a small price for one vocabulary.
bind Left select-pane -L
bind Right select-pane -R
bind Up select-pane -U
bind Down select-pane -D
bind m set -g mouse \; display-message " mouse #{?mouse,on,off}"
bind r source-file ~/.tmux.conf \; display-message " config reloaded"
# Same trap, same fix: one letter is not a gate on a whole session. Cancel first.
if -F "#{>=:#{version},3.5}" {
  bind X display-menu -M -T "#[align=centre] close the whole #S office? " -x P -y P \
    " keep it"     k "" \
    ""             "" "" \
    " close it"    c "kill-session"
} {
  bind X display-menu -T "#[align=centre] close the whole #S office? " -x P -y P \
    " keep it"     k "" \
    ""             "" "" \
    " close it"    c "kill-session"
}
# Raw splits and extra windows are gone too: a split nobody placed breaks the
# grid, and the next n would put it back anyway.
unbind | ; unbind - ; unbind C
bind S choose-tree -Zs
bind Space last-window
unbind '"' ; unbind %

# --- the grid follows a close ------------------------------------------------
# office.zsh rebuilds the grid after everything it does itself. A close is the
# one change that does not pass through it, and it arrives two ways: a kill (q,
# `office clean`) is after-kill-pane, and a pane whose own command ended (`exit`
# in a shell) is pane-exited — measured on 3.7b, it fires with remain-on-exit
# off. tmux keeps the space in the neighbour, so without these a closed column
# leaves its neighbour twice as wide as the rest.
#
# Only inside an office (@office_root is written on every office session), so a
# plain tmux session on the same server keeps whatever shape you gave it.
set-hook -g after-kill-pane {
  if -F "#{&&:#{@office_root},#{@office_home}}" {
    run-shell -b "zsh -fc '. \"#{@office_home}/office.zsh\" && _office_grid \"#{session_name}\"' >/dev/null 2>&1 || true"
  }
}
set-hook -g pane-exited {
  if -F "#{&&:#{@office_root},#{@office_home}}" {
    run-shell -b "zsh -fc '. \"#{@office_home}/office.zsh\" && _office_grid \"#{session_name}\"' >/dev/null 2>&1 || true"
  }
}

# --- copy mode (vi keys, system clipboard) -----------------------------------
# -H on every door into copy mode. Without it tmux prints [0/1234] over the top
# right of the pane: lines you have scrolled up, out of lines of scrollback that
# exist. It is a scroll odometer, and it reads as a broken selection counter —
# the 0 never moves however much you copy, and the second number creeps up on
# its own as the pane produces output. Neither number is worth a readout in a
# pane you copy from with the mouse.
bind Enter copy-mode -H
bind -T copy-mode-vi v send -X begin-selection
# tmux's own root WheelUpPane, restated for one reason: the -H.
bind -n WheelUpPane if -F "#{||:#{alternate_on},#{||:#{pane_in_mode},#{mouse_any_flag}}}" \
  "send -M" "copy-mode -eH"
# Whatever this machine calls the clipboard: pbcopy on macOS, clip.exe under
# WSL, wl-copy or xclip on Linux. Picked at copy time by sh, which is shorter
# and more honest than three nested if-shells resolving it at load.
set -g @office_copy "sh -c 'command -v pbcopy >/dev/null && exec pbcopy; command -v clip.exe >/dev/null && exec clip.exe; command -v wl-copy >/dev/null && exec wl-copy; exec xclip -selection clipboard'"
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "#{@office_copy}"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "#{@office_copy}"

# --- getting back out --------------------------------------------------------
# You do not choose to enter copy mode here. A wheel-up or a drag puts you in
# it, and then the pane stops being a shell: the arrows walk a cursor around
# scrollback, nothing you type reaches the prompt, and the only thing on screen
# saying so is a [0/39] in the corner. tmux's own way out is `q`, which is a
# vi habit and not a thing anyone guesses while wondering why their terminal
# went dead.
#
# The two keys a human actually reaches for both did NOTHING here — measured
# against a real client, not assumed. Escape is bound to clear-selection in
# tmux's vi table, which with no selection is a no-op; a click is bound to
# select-pane, which the pane already is. So both fail silently, which is the
# worst way to fail.
#
# Escape cancels. That costs vi's clear-selection, and the office is not a vim
# tutorial: press Escape twice and the second one is free.
bind -T copy-mode-vi Escape send -X cancel
# A click puts you back at the live prompt, the way clicking does in every
# terminal that has no copy mode at all. It is bound on the RELEASE, not the
# press: tmux sends MouseDragEnd1Pane instead of MouseUp1Pane when a drag
# happened, so selecting text still copies, and cancelling on the press would
# snap the view to the bottom before the drag could start.
#
# The selection guard is not caution, it is a measured regression. A
# double-click is down, up, down, up, and the word-copy it fires has to wait out
# tmux's triple-click window before it can pipe anything. That last `up` lands
# mid-wait, and an unguarded cancel ate the word and left the pane in the hidden
# copy mode the double-click had opened: the gesture broke and the trap this
# whole section removes came back through the other door. A selection in flight
# means something is already copying, so the click is not a human asking to
# leave.
bind -T copy-mode-vi MouseUp1Pane if -F "#{==:#{selection_present},0}" "send -X cancel"

# --- the mouse ---------------------------------------------------------------
# The mouse does ONE thing here, and it is copying. A double-click takes the
# word under it, a triple-click the line, a drag whatever you crossed, and all
# three land on the system clipboard with nothing to press afterwards.
#
# A double-click briefly ALSO zoomed the pane, as a mouse synonym for
# Ctrl-Space z. It is removed, and this is the trap worth recording:
#
#   - it could never work everywhere. micro, fzf and Claude Code all turn mouse
#     reporting on, and taking the double-click away from them would cost the
#     file list its click-to-open, micro its cursor, and Claude Code its own
#     select-to-copy. So it zoomed in a shell and did nothing in half the panes.
#   - it was slow even where it worked. tmux cannot fire DoubleClick until the
#     triple-click window has passed, and that wait is not configurable.
#
# A key that already exists, works in every pane, and answers instantly beats a
# gesture that needs a paragraph of exceptions. Zoom is Ctrl-Space z.
#
# This is tmux's own default double-click, restated for one reason: the word goes
# to the SYSTEM clipboard through @office_copy instead of stopping in a tmux
# buffer you would need a prefix key to paste from.
#
# TripleClick is deliberately NOT restated the same way. The third click lands
# while the double-click's copy is still pending, so the line binding fires
# against an empty selection and puts a bare newline on your clipboard —
# measured, not guessed. tmux's own triple-click still selects the line into a
# tmux buffer, and a drag copies any line you actually want.
bind -n DoubleClick1Pane select-pane -t= \; if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send -M" \
  { copy-mode -H ; send -X select-word ; run-shell -d0.3 ; send -X copy-pipe-and-cancel "#{@office_copy}" }

# --- moving a pane: drag its title --------------------------------------------
# Press on a pane's title line, drag, let go over another pane, and the pane
# moves to that place; the ones in between shift along. Measured on 3.7b through
# a real client: the press arrives as MouseDown1Border with #{mouse_pane} set to
# the pane that OWNS the title, and letting go over a pane arrives as
# MouseDragEnd1Pane with #{mouse_pane} set to the pane under the pointer.
#
# The cost, on purpose: dragging a BORDER no longer resizes (tmux's own
# MouseDrag1Border). tmux reports the divider between two columns as that same
# MouseDown1Border, with no coordinates to tell it from a title, so one gesture
# has to win. The grid puts every size back on the next change anyway, and z
# gives a pane the whole window.
#
# Armed on the DRAG, not the press, so a plain click on a title only focuses the
# pane. Disarmed by every other press, so a drag that ended nowhere never moves
# a pane on some later, unrelated drag.
# ponytail: a drop onto a pane that is scrolled back (in copy mode) goes to the
# copy-mode table and moves nothing; the next press disarms it. Scroll down first.
bind -n MouseDown1Border select-pane -t =
bind -n MouseDrag1Border set -gF @office_drag "#{mouse_pane}"
bind -n MouseDragEnd1Border set -gu @office_drag
bind -n MouseDown1Pane { set -gu @office_drag ; select-pane -t = ; send -M }
bind -n MouseDragEnd1Pane if -F "#{&&:#{@office_drag},#{!=:#{@office_drag},#{mouse_pane}}}" {
  run-shell -b "zsh -fc '. \"#{@office_home}/office.zsh\" && _office_move \"#{@office_drag}\" \"#{mouse_pane}\"' >/dev/null 2>&1 || true"
  set -gu @office_drag
} {
  set -gu @office_drag
  send -M
}

# Drag to select, let go, it is on the clipboard. No Ctrl-C, no prefix.
# tmux already does this in a plain shell — a drag opens copy mode and the
# binding above pipes the selection to pbcopy on release. The FILE EDITOR is the
# exception: micro and fzf hold the mouse there, and neither can reach the
# system clipboard on macOS (micro copies a mouse selection to the PRIMARY
# selection, which macOS does not have), so office keeps the drag for tmux in
# that ONE pane kind. Selecting text to type over it is Shift-arrow, which an
# open file already gets; a click still places the cursor.
bind -n MouseDrag1Pane if -F "#{||:#{pane_in_mode},#{&&:#{mouse_any_flag},#{!=:#{@office_kind},EDITOR}}}" \
  "send -M" "copy-mode -HM"

# --- which desk is waiting on you --------------------------------------------
# The gate for the "your turn" readout, in ONE place so the theme's border can
# reuse it instead of restating a hundred characters of it. Three conditions,
# and each of them saves a fork:
#
#   @office_home     where the package lives. office.zsh writes it into the
#                    server, because a tmux config cannot know its own path and
#                    a #() job runs with the SERVER's PATH, not your shell's.
#                    Missing (an office opened by an older office.zsh) turns the
#                    whole thing off rather than running something that is not
#                    there.
#   kind is CLAUDE   only a desk can be waiting on you. The strip's shell and
#                    file list are yours to be slow in.
#
# There USED to be a third condition -- not the active pane -- on the reasoning
# that you are already looking at the one you are in. Removed on the operator's
# call, and the case that killed it is the one the whole readout is for: you walk
# away for the night with a desk focused, and that is exactly the desk with no
# number on it in the morning. "You are looking at it" is true for the ten
# seconds you are at the keyboard and false for the eight hours you are not.
#
# It costs nothing to be noisy, either: typing in a pane MOVES it, which restarts
# its clock, so the desk you are actually working in never reaches the wait. A
# marker on the pane you are in means the agent stopped and you have not answered
# it yet, which is true and worth saying.
#
# tmux expands only the branch it takes, so a pane that fails this gate costs
# nothing at all. Verified on 3.7b: with two panes and one desk, only the desk
# ran the job.
set -g @office_attn_gate "#{&&:#{@office_home},#{==:#{@office_kind},CLAUDE}}"
# #{E:} and not #{}: E expands the option's own formats, and the plain form
# hands the conditional to the border LITERALLY.
#
# No colour here, ever — that is theme/. @office_attn_style is the seam: unset,
# it expands to nothing and the words arrive in the border's own tone, which is
# the right answer for someone else's theme. theme/office-theme.tmux.conf sets
# it to the one accent colour it allows itself.
set -g @office_attn "#{?#{E:@office_attn_gate},#{@office_attn_style}#(#{@office_home}/bin/office-attn #{pane_id})#[default],}"

# --- how full each desk's context window is ----------------------------------
# Same shape, one condition shorter: this one is NOT hidden on the pane you are
# sitting in. "Which of these should I compact" is a question you ask about the
# desk in front of you as often as about the other three, and unlike "your turn"
# the number is not news you have already had by being there.
#
# It stays quiet unless it can read Claude Code's own session files, so a desk
# running anything else simply has no number. bin/office-ctx says why, and where
# to change it.
set -g @office_ctx_gate "#{&&:#{@office_home},#{==:#{@office_kind},CLAUDE}}"
# No colour here either. The two styles are seams the theme fills; unset, the
# number arrives in the border's own tone and the marks are still honoured, which
# is the right answer for someone else's theme. The script emits its own
# #[default] because there is another readout after it.
set -g @office_ctx "#{?#{E:@office_ctx_gate},#(#{@office_home}/bin/office-ctx #{pane_id}),}"

# --- pane borders ------------------------------------------------------------
# Three things office needs from the border, and a theme must preserve all of
# them:
#
#   @office_num    OUR pane number. tmux's own #{pane_index} follows the layout
#                  TREE, which join-pane leaves in an order the eye disagrees
#                  with. office numbers panes from their geometry instead.
#   the label      what the pane is, and what it is currently doing. It is
#                  also the handle you drag to move the pane.
#   @office_ctx    how full that desk's context window is.
#   @office_attn   the "your turn" readout above. Both go at the END, and attn
#                  goes last: they are the two things on a border that change on
#                  their own, so they sit where nothing has to move to make room
#                  for them, and the loudest one sits outermost.
set -g pane-border-lines single
set -g pane-border-format " #{?@office_num,#{@office_num},#{pane_index}} #{?@office_label,#{@office_label},#{pane_current_command}}#{?#{||:#{==:#{pane_title},#{host}},#{==:#{pane_title},#{host_short}}},,#{?@office_label, · #{=32:pane_title},}}#{E:@office_ctx}#{E:@office_attn} "

# --- the text cursor ---------------------------------------------------------
# tmux owns the cursor shape inside a session, so a terminal-profile setting is
# quietly ignored in here. An app that emits its own DECSCUSR still wins.
setw -g cursor-style blinking-underline
